<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Very Visual Editor</title>
  <script src="js/script.js" type="module"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <div class="toolbar center">
      <button id="ht"   class="nest card button">HTML</button>
      <button id="cs"   class="nest card button">CSS</button>
      <button id="js"   class="nest card button">JavaScript</button>
      <button id="prev" class="nest card button">Preview</button>
    </div>
  </div>
  <div id="main">
    <div id="editor-container">
      <div id="editarea" class="card">
        <h2>Editor</h2>
        <div id="editor" contenteditable="true" class="card"></div>
      </div>
    </div>
</body>
